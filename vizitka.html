<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ваш персонал — визитка</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7f8;
    --card-bg: #ffffff;
    --text: #1f2937;
    --heading: #111827;
    --muted: #6b7280;
    --border: #e5e7eb;
    --blue: #3b82f6;
    --violet: #8b5cf6;
    --green: #10b981;
    --telegram: #0088cc;
    --whatsapp: #25D366;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    line-height: 1.6;
  }

  .card {
    background: var(--card-bg);
    border-radius: 1rem;
    padding: 48px 32px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    border: 1px solid var(--border);
  }

  .logo-wrapper {
    width: 72px;
    height: 72px;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .name {
    font-size: 2rem;
    font-weight: 800;
    margin: 0 0 8px;
    letter-spacing: -0.025em;
    background: linear-gradient(90deg, var(--blue), var(--violet), var(--green));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .role {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 32px;
    padding: 0 8px;
  }

  .socials {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-bottom: 32px;
  }

  .socials a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    border-radius: 0.75rem;
    background: #f8fafc;
    border: 1px solid var(--border);
    color: var(--text);
    text-decoration: none;
    font-size: 1.3rem;
    transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
  }

  .socials a:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.12);
  }

  .socials a.telegram:hover { background: var(--telegram); color: #fff; border-color: var(--telegram); }
  .socials a.whatsapp:hover { background: var(--whatsapp); color: #fff; border-color: var(--whatsapp); }
  .socials a.instagram:hover {
    background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    color: #fff;
    border-color: transparent;
  }
  .socials a.email:hover { background: var(--violet); color: #fff; border-color: var(--violet); }

  .contact-btn {
    display: inline-block;
    padding: 14px 36px;
    border-radius: 0.75rem;
    background: linear-gradient(90deg, var(--blue), var(--violet), var(--green));
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 1rem;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .contact-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 24px rgba(139, 92, 246, 0.35);
  }

  .contact-info {
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
    line-height: 1.7;
  }

  @media (max-width: 480px) {
    .card { padding: 36px 20px; }
    .name { font-size: 1.6rem; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="logo-wrapper">
      <img src="logo-main.png" alt="Ваш персонал">
    </div>
    <h1 class="name">Ваш персонал</h1>
    <p class="role">Подбор домашнего персонала в Алматы — няни, гувернантки, домработницы, повара, водители, садовники</p>

    <div class="socials">
      <a class="telegram" href="https://t.me/vashpersonal_alm" title="Telegram" target="_blank" rel="noopener">✈️</a>
      <a class="instagram" href="https://instagram.com/vash.personal.alm" title="Instagram" target="_blank" rel="noopener">📸</a>
      <a class="whatsapp" href="https://wa.me/77072259373" title="WhatsApp" target="_blank" rel="noopener">💬</a>
      <a class="email" href="mailto:vashpersonal.alm@gmail.com" title="Email">✉️</a>
    </div>

    <a class="contact-btn" href="https://wa.me/77072259373" target="_blank" rel="noopener">Написать нам</a>

    <p class="contact-info">
      +7 707 225 9373<br>
      г. Алматы, мкр. Саиран 14, БЦ «Азия S», 1 этаж<br>
      Пн-Пт: 9:00–18:00
    </p>
  </div>

</body>
</html>
